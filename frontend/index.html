    <!-- Textový obsah pro roboty a AI, kteří nespouštějí JavaScript.

    <noscript>
      <main style="max-width:720px;margin:0 auto;padding:24px;font-family:sans-serif;line-height:1.6">
        <h1>Peopleworth — Lidé jsou tvé bohatství</h1>
        <p><strong>Peopleworth</strong> je chytrá webová aplikace pro správu kontaktů. Každý seznam si
        přizpůsobíš vlastními poli, vedeš si deník setkání, propojuješ lidi mezi sebou a AI asistent ti
        pomáhá pečovat o vztahy, na kterých ti záleží.</p>

        <p><strong>Pro koho:</strong> networkeři, podnikatelé, freelanceři i každý, kdo chce mít v kontaktech
        pořádek a nezapomínat na lidi kolem sebe.</p>

        <h2>Co aplikace nabízí</h2>
        <ul>
          <li><strong>Seznamy s vlastními poli</strong> — libovolný počet seznamů (networking, byznys, přátelé, rodina) s poli na míru.</li>
          <li><strong>Kniha záznamů</strong> — datovaný deník setkání u každého kontaktu, se štítky a fotkami.</li>
          <li><strong>Signál</strong> — radar, který upozorní na dlouho nekontaktované lidi a blížící se narozeniny.</li>
          <li><strong>Úkoly a připomínky</strong> — ke konkrétním kontaktům, s termínem.</li>
          <li><strong>Propojení kontaktů</strong> — zaznamenáš kdo koho zná.</li>
          <li><strong>AI asistent</strong> — zná vše, co sis o kontaktu zapsal, a poradí, jak o vztah pečovat.</li>
          <li><strong>Skenování vizitky</strong> — AI vytáhne kontaktní údaje z fotky vizitky.</li>
          <li><strong>Digitální vizitka</strong> — vlastní vizitka s veřejnou URL, sdílitelná bez přihlášení.</li>
        </ul>

        <h2>Cena</h2>
        <p>Aplikace je <strong>zdarma a bez limitu počtu kontaktů</strong>. AI funkce se platí kredity
        odpovídajícími skutečným nákladům na provoz. Nový účet dostane 25 kreditů zdarma.</p>

        <h2>Časté dotazy</h2>
        <h3>Je Peopleworth zdarma?</h3>
        <p>Ano. Správa kontaktů, seznamy, deník i připomínky jsou zdarma a bez limitu počtu kontaktů.
        Platí se jen AI funkce, a to kredity odpovídajícími nákladům na provoz.</p>
        <h3>Musím něco instalovat?</h3>
        <p>Ne. Peopleworth běží v prohlížeči. Na mobilu si ho můžeš přidat na plochu jako aplikaci (PWA).</p>
        <h3>Jsou moje data v bezpečí?</h3>
        <p>Ano. Data jsou dostupná jen tobě, můžeš je exportovat i smazat účet. Aplikace je v souladu s GDPR.</p>
